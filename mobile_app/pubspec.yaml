name: whatsapp_reminder_app
description: Flexible Timetable & Activity Reminder App with Offline Alarms, Notifications, and Automated WhatsApp Messaging.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^17.2.4
  flutter_timezone: ^3.0.1
  timezone: ^0.9.4
  http: ^1.2.2
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  uuid: ^4.5.1
  android_alarm_manager_plus: ^5.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

